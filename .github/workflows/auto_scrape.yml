name: Auto Novel Scraper

on:
  schedule:
    - cron: '0 */6 * * *'  # كيشغّل السكريبت أوتوماتيكياً كل 6 سوايع
  workflow_dispatch:      # كايسمح ليك تشغّلو يدويًا وقتما بغيتي فـ GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 flask

      - name: Run Scraper
        run: python smart_novel_engine.py

      - name: Save & Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 أوتوماتيكي: تحديث الفصول والصفحات" && git push)
